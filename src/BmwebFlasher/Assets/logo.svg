<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BMWeb Flasher logo">
  <!-- The BMWeb roundel in the Brackets skin's palette (dist-web/css/themes.css,
       html[data-theme='brackets']): flat dark grey, a yellow border, yellow and
       blue quadrants. FLASHER runs across the centre on a band so it reads at
       icon size against both quadrant colours. -->
  <!-- outer ring -->
  <circle cx="50" cy="50" r="48" fill="#2a2d2e" stroke="#f8de7e" stroke-opacity="0.6" stroke-width="3"/>
  <!-- inner quadrant disc -->
  <clipPath id="disc"><circle cx="50" cy="50" r="31"/></clipPath>
  <g clip-path="url(#disc)">
    <!-- yellow: top-left, bottom-right -->
    <rect x="19" y="19" width="31" height="31" fill="#f8de7e"/>
    <rect x="50" y="50" width="31" height="31" fill="#f8de7e"/>
    <!-- blue: top-right, bottom-left -->
    <rect x="50" y="19" width="31" height="31" fill="#5db0d7"/>
    <rect x="19" y="50" width="31" height="31" fill="#5db0d7"/>
  </g>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#f8de7e" stroke-opacity="0.3" stroke-width="2"/>
  <!-- FLASHER band: ring colour, clipped to the disc edge, thin yellow rule
       top and bottom so it reads as part of the mark rather than a sticker -->
  <clipPath id="band"><circle cx="50" cy="50" r="48"/></clipPath>
  <g clip-path="url(#band)">
    <rect x="0" y="41.5" width="100" height="17" fill="#2a2d2e"/>
    <rect x="0" y="41.5" width="100" height="0.9" fill="#f8de7e" fill-opacity="0.6"/>
    <rect x="0" y="57.6" width="100" height="0.9" fill="#f8de7e" fill-opacity="0.6"/>
  </g>
  <text x="50" y="54.9" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="12.5" letter-spacing="1.6" fill="#f8de7e">FLASHER</text>
</svg>
